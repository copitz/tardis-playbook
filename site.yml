---
- hosts: all
  environment: "{{ ansible_environment | default({}) }}"
  roles:
    - role: general
      tags: [ge]
    - role: lvm
      tags: [lvm]

- hosts: workstation
  environment: "{{ ansible_environment | default({}) }}"
  roles:
    - role: zfs-import
      tags: [zfs]
    - role: desktop-environment
      tags: [de]

- hosts: all
  environment: "{{ ansible_environment | default({}) }}"
  roles:
    - role: iam
      tags: [iam]
    - role: docker
      tags: [docker]
      # ark has no docker/stacks setup yet - opt it back in once it's ready.
      when: inventory_hostname != 'ark'
    - role: drivers
      tags: [drivers]

- hosts: workstation
  environment: "{{ ansible_environment | default({}) }}"
  roles:
    - role: network-trunked
      tags: [net]

- hosts: all
  environment: "{{ ansible_environment | default({}) }}"
  roles:
    - role: stacks
      tags: [stacks]
      # ark has no docker/stacks setup yet - opt it back in once it's ready.
      when: inventory_hostname != 'ark'

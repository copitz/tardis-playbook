stacks_data_dir: /var/stacks

domain: c12z.de

# Inventory hostname of the restic REST server clients back up against (see
# roles/backup) - client.yml delegates to this host to provision its own
# htpasswd entry and symlink tree on it.
backup_server_host: ark

# How every client's ensure-server-on (roles/backup/files/ensure-server-on)
# wakes ark up over WoL before backing up against it - one shared config
# since it's the same physical NIC regardless of which client is waking it.
backup_server_wol_host: "{{ ipam_hosts.ark.domain }}"
backup_server_wol_mac: "{{ ipam_hosts.ark.mac }}"
services:
  z2m:
    image: ghcr.io/koenkk/zigbee2mqtt:2
    restart: unless-stopped
    volumes:
      - ${STACKS_DATA_DIR:?}/z2m/data:/app/data
      - /run/udev:/run/udev:ro
      - /dev/serial:/dev/serial
      - ./extensions:/app/data/external_extensions
    devices:
      - /dev/ttyUSB0
    environment:
      TZ: Europe/Berlin
      Z2M_WATCHDOG: default
    secrets:
      - source: z2m_secrets
        target: /app/data/secrets.yaml
    networks:
      - default
      - traefik
      - mqtt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.z2m.rule=Host(`${DOMAIN:?}`)"
      - "traefik.http.routers.z2m.entrypoints=https"
      - "traefik.http.services.z2m.loadbalancer.server.port=8080"

secrets:
  z2m_secrets:
    file: ./.secrets.yaml

networks:
  traefik:
    external: true
  mqtt:
    name: mqtt
    external: true

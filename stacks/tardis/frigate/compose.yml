services:
  reostream:
    #image: "quantumentangledandy/neolink"
    image: "ghcr.io/volttech21/reostream"
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${STACKS_DATA_DIR:?}/frigate/reostream:/data
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - default
      - iot
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reostream.rule=Host(`${REOSTREAM_DOMAIN}`)"
      - "traefik.http.routers.reostream.entrypoints=https"
      - "traefik.http.services.reostream.loadbalancer.server.port=8562"

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    restart: unless-stopped
    shm_size: "146mb" # update for your cameras based on calculation in frigate docs
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${STACKS_DATA_DIR:?}/frigate/config:/config
      - ${STACKS_DATA_DIR:?}/frigate/storage:/media/frigate
      - type: tmpfs # 1GB in-memory filesystem for recording segment storage
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frigate.rule=Host(`${FRIGATE_DOMAIN}`)"
      - "traefik.http.routers.frigate.entrypoints=https"
      - "traefik.http.services.frigate.loadbalancer.server.port=8971"
    environment:
      TZ: "Europe/Berlin"
      FRIGATE_RTSP_PASSWORD: "password"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          devices:
            - driver: nvidia
              count: all # Use all GPUs
              capabilities: [gpu]
    depends_on:
      - reostream

networks:
  traefik:
    external: true
  iot:
    name: 'iot-net'
    external: true
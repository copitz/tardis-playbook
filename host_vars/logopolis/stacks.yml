traefik_domain: "{{ ipam_hosts.logopolis.domain }}"

stacks:
  traefik:
    ip: ~ # Unused - host ports on ipam_hosts.logopolis, DNS handled by mikrotik
    domain: "{{ traefik_domain }}"
    crt_domain_main: "*.{{ domain }}"
    crt_domain_sans: "*.{{ traefik_domain }}"
    crt_email: "intra-apps@{{ domain }}"
  z2m:
    domain: "z2m.{{ domain }}"
    cname: "{{ traefik_domain }}"
    secrets: "{{ z2m_secrets }}"
  mqtt:
    domain: "{{ stacks.z2m.domain }}"
    cname: "{{ traefik_domain }}"
    users: "{{ mqtt_users }}"
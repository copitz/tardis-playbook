# ensure-server-on wakes the backup server up over WoL and confirms
# restic-rest-server is actually reachable before a backup can run against
# it - every client needs this (see backup.sh.j2). The Wake-on-LAN packet
# itself is sent with Python's stdlib (see roles/backup/files/ensure-server-on),
# so there's no extra package to install for that.
- name: Install ensure-server-on script
  ansible.builtin.copy:
    src: ensure-server-on
    dest: /opt/backup/ensure-server-on
    owner: root
    group: root
    mode: "0755"

# Also carries RESTIC_REPOSITORY_BASE (see server.conf.j2), which embeds
# this host's restic-rest-server password - root-only, unlike the rest of
# /opt/backup, on account of that.
- name: Configure backup server connection
  ansible.builtin.template:
    src: server.conf.j2
    dest: /opt/backup/server.conf
    owner: root
    group: root
    mode: "0600"

# backup.sh/restore.sh (below) shell out to the restic binary directly -
# unlike the server side, there's no restic-rest-server-style package that
# pulls it in as a dependency, so it needs installing explicitly here.
- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present

# One backup/restore script pair per host, covering three source tiers -
# system (same everywhere, backup_system, into the repository shared by all
# hosts), assets (per-host, explicit, backup_assets), configs (this host's
# stacks data dir, backup_configs). See defaults/main.yml for where those
# come from. Repository locations, HTTP-auth credentials and restic
# encryption passwords all come from /opt/backup/server.conf above.
- name: Generate backup/restore scripts
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "/opt/backup/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - backup
    - restore

# Provision this host's own corner of the restic REST server - done here
# rather than in tasks/server.yml so running the role for a single client
# doesn't depend on the server's own tasks having run first in the same
# invocation (see backup_client_tiers / backup_tier_dirs in defaults/main.yml
# for the tier-name mapping). Delegated to backup_server_host throughout.
#
# Each repository is served as <backup_server_dir>/<host>/<tier>, symlinked
# into <tier volume>/<host> - except system, whose symlink points every host
# at the one shared backup_system_repo_dir instead.
- name: Provision this host on the restic REST server
  when: backup_client_tiers | length > 0
  vars:
    backup_repo_dirs: >-
      {{ dict(backup_client_tiers | zip(backup_client_tiers | map('extract', backup_tier_dirs)
           | map('regex_replace', '^(.*)$', backup_tiers_dir ~ '/\1/' ~ inventory_hostname)))
         | combine({'system': backup_system_repo_dir} if 'system' in backup_client_tiers else {}) }}
  block:
    - name: Ensure python3-passlib is present on the backup server
      ansible.builtin.apt:
        name: python3-passlib
        state: present
      delegate_to: "{{ backup_server_host }}"

    # Same --check reasoning as tasks/server.yml: the restic-rest-server
    # system user everything below chowns to (and the htpasswd file it
    # writes into) only exist once the backup server's own restic-rest-server
    # package is really installed - which this client-side block can't
    # assume has happened yet under --check.
    - name: Check whether restic-rest-server unit file exists on the backup server yet
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/restic-rest-server.service
      register: backup_restic_rest_server_unit_stat
      delegate_to: "{{ backup_server_host }}"

    # restic-rest-server 404s on init rather than creating a repository's
    # directory itself, so each one needs provisioning here.
    - name: "Ensure {{ inventory_hostname }}'s repository directories exist on the backup server"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: restic-rest-server
        group: restic-rest-server
        mode: "0750"
      loop: "{{ backup_repo_dirs.values() | list }}"
      delegate_to: "{{ backup_server_host }}"
      when: backup_restic_rest_server_unit_stat.stat.exists or not ansible_check_mode

    - name: "Ensure {{ inventory_hostname }}'s private directory exists on the backup server"
      ansible.builtin.file:
        path: "{{ backup_server_dir }}/{{ inventory_hostname }}"
        state: directory
        owner: restic-rest-server
        group: restic-rest-server
        mode: "0750"
      delegate_to: "{{ backup_server_host }}"
      when: backup_restic_rest_server_unit_stat.stat.exists or not ansible_check_mode

    # restic-rest-server's --private-repos routing only matches requests one
    # path segment below the username (confirmed by it 404ing - with nothing
    # even reaching its own request logging - on a second nested segment) -
    # hence <host>/<tier> and nothing deeper.
    - name: "Ensure {{ inventory_hostname }}'s repository symlinks exist on the backup server"
      ansible.builtin.file:
        path: "{{ backup_server_dir }}/{{ inventory_hostname }}/{{ item.key }}"
        src: "{{ item.value }}"
        state: link
      loop: "{{ backup_repo_dirs | dict2items }}"
      delegate_to: "{{ backup_server_host }}"
      when: backup_restic_rest_server_unit_stat.stat.exists or not ansible_check_mode

    - name: "Add/update {{ inventory_hostname }}'s restic-rest-server user"
      community.general.htpasswd:
        path: /etc/restic-rest-server/users.htpasswd
        name: "{{ inventory_hostname }}"
        password: "{{ backup_server_password }}"
        crypt_scheme: bcrypt
        owner: root
        group: restic-rest-server
        mode: "0640"
      delegate_to: "{{ backup_server_host }}"
      when: >-
        backup_server_password is defined
        and (backup_restic_rest_server_unit_stat.stat.exists or not ansible_check_mode)
      notify: restart restic-rest-server

# The key task below talks to restic-rest-server as this host, so a
# just-added/changed htpasswd user needs to be live first.
- name: Apply pending restic-rest-server restart
  ansible.builtin.meta: flush_handlers

# The shared system repository has one master key, but restic lets any
# number of passwords ("keys") unlock it - so rather than a separate shared
# secret, each host's own backup_restic_password is added as a key of its
# own. Run from this host (as itself, against restic-rest-server) rather
# than on the backup server, so restic-rest-server keeps owning everything
# on disk. Adding a key needs an already-working password, so this tries
# every other host's (from their own vars - which is why it lives here
# rather than in backup.sh, where only this host's is available). Whichever
# host gets here first just initializes the repository with its own; two
# racing on that is fine, the loser falls through to adding its key with
# the winner's password. Exit codes 10/12 are restic's own "repository does
# not exist"/"wrong password".
- name: Ensure {{ inventory_hostname }}'s password unlocks the shared system repository
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      source /opt/backup/server.conf
      /opt/backup/ensure-server-on >/dev/null || exit 1
      repo="$RESTIC_REPOSITORY_BASE/{{ inventory_hostname }}/system"
      own="$RESTIC_PASSWORD"
      export RESTIC_PASSWORD

      restic -r "$repo" cat config >/dev/null 2>&1 </dev/null; rc=$?
      if ((rc == 10)); then
          if restic -r "$repo" init </dev/null; then echo "initialized"; exit 0; fi
          restic -r "$repo" cat config >/dev/null 2>&1 </dev/null; rc=$?
      fi
      ((rc == 0)) && exit 0
      if ((rc != 12)); then
          echo "restic cat config on the shared system repository failed with exit code $rc" >&2
          exit 1
      fi

      # Other hosts' passwords, one per line on stdin
      while IFS= read -r other; do
          [[ -n "$other" ]] || continue
          if RESTIC_PASSWORD="$other" restic -r "$repo" key add --host {{ inventory_hostname | quote }} \
              --new-password-file <(printf '%s' "$own") </dev/null; then
              echo "added"
              exit 0
          fi
      done
      # Not $repo - it embeds this host's restic-rest-server password
      echo "None of the other hosts' passwords unlock the shared system repository - can't add a key for {{ inventory_hostname }}" >&2
      exit 1
    # A literal block with real line breaks rather than a {{ '\n' }} escape -
    # in task args, Ansible renders that as a literal backslash-n, gluing all
    # passwords into one line.
    stdin: |
      {% for h in groups['all'] if h != inventory_hostname %}
      {% set hv = hostvars[h] %}
      {{ hv.backup_restic_password | default(hv.backup_server_password) | default(hv.backup_password) | default('') }}
      {% endfor %}
  register: backup_system_repo_key
  changed_when: backup_system_repo_key.stdout_lines | intersect(['initialized', 'added']) | length > 0
  no_log: true
  when: >-
    'system' in backup_client_tiers
    and backup_server_password is defined
    and backup_restic_password is defined

# Powers the host off automatically once it's had no SSH connections for a
# while - the backup server only needs to be up long enough for clients to
# back up against.
- name: Install idle-poweroff script
  ansible.builtin.copy:
    src: idle-poweroff
    dest: /opt/backup/idle-poweroff
    owner: root
    group: root
    mode: "0755"

- name: Install idle-poweroff systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - idle-poweroff.service
    - idle-poweroff.timer

- name: Check whether idle-poweroff.timer unit file exists yet
  ansible.builtin.stat:
    path: /etc/systemd/system/idle-poweroff.timer
  register: backup_idle_poweroff_timer_stat

# In --check, a fresh host has no real unit file yet (the copy above was
# only simulated) - skip cleanly instead of letting systemd fail on it.
- name: Enable and start idle-poweroff timer
  ansible.builtin.systemd:
    name: idle-poweroff.timer
    daemon_reload: true
    enabled: true
    state: started
  when: backup_idle_poweroff_timer_stat.stat.exists or not ansible_check_mode

# restic-rest-server accepts backup/restore requests from clients (see
# backup.sh.j2 / restore.sh.j2). The Debian package ships its own
# restic-rest-server.service unit plus a system user to run it as, so there's
# nothing to install by hand beyond configuring and enabling it.
- name: Install restic-rest-server
  ansible.builtin.apt:
    name: restic-rest-server
    state: present

- name: Check whether restic-rest-server unit file exists yet
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/restic-rest-server.service
  register: backup_restic_rest_server_unit_stat

# The private per-user root rest-server serves from (--private-repos) - each
# client's own subtree under here is a symlink into the real tier volume
# (see tasks/client.yml), created per-client so this doesn't need to know
# the client list up front.
#
# Same --check reasoning as idle-poweroff.timer above: the restic-rest-server
# system user this chowns to only exists once the apt install above has
# really happened.
- name: Ensure backup_server_dir exists
  ansible.builtin.file:
    path: "{{ backup_server_dir }}"
    state: directory
    owner: restic-rest-server
    group: restic-rest-server
    mode: "0750"
  when: backup_restic_rest_server_unit_stat.stat.exists or not ansible_check_mode

- name: Configure restic-rest-server
  ansible.builtin.copy:
    dest: /etc/default/restic-rest-server
    owner: root
    group: root
    mode: "0644"
    content: |
      # Generated by Ansible (roles/backup) - re-run the playbook to
      # update, don't edit by hand.
      LISTEN = :{{ backup_server_port }}
      BACKUP_DIR = {{ backup_server_dir }}

      ARGS = "\
        --htpasswd-file /etc/restic-rest-server/users.htpasswd \
        --private-repos \
      "
  notify: restart restic-rest-server

# Same --check reasoning as idle-poweroff.timer above: the unit file only
# exists once the apt install above has really happened.
- name: Enable and start restic-rest-server
  ansible.builtin.systemd:
    name: restic-rest-server
    daemon_reload: true
    enabled: true
    state: started
  when: backup_restic_rest_server_unit_stat.stat.exists or not ansible_check_mode

- name: Create volume groups
  community.general.lvg:
    vg: "{{ item.name }}"
    pvs: "{{ item.pvs }}"
    pesize: "{{ item.pesize }}"
    state: active
  loop: "{{ lvm_vgs | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create volumes
  community.general.lvol:
    vg: "{{ item.vg }}"
    lv: "{{ item.name }}"
    size: "{{ item.size }}"
    shrink: false
    # pvs/create_opts let an LV be pinned to specific disks or created with a
    # non-default lvcreate --type (e.g. raid1 for mirroring), instead of the
    # default of striping/spanning across whichever PVs the VG has free space on.
    pvs: "{{ item.pvs | default(omit) }}"
    opts: "{{ item.create_opts | default(omit) }}"
  loop: "{{ lvm_lvs }}"
  loop_control:
    label: "{{ item.name }} ({{ item.size }})"
  register: lvm_lv_create_result

# With shrink=false, lvol silently leaves a volume that is already bigger than
# requested alone - which happens when someone grew it manually outside of
# this config. Flag it instead of letting the config quietly drift.
- name: Warn about volumes larger on disk than configured
  ansible.builtin.debug:
    msg: >-
      /dev/{{ item.item.vg }}/{{ item.item.name }} is {{ item.size }}{{ item.item.size | regex_search('[a-zA-Z]+$') }}
      on disk but only {{ item.item.size }} is configured - update host_vars/lvm.yml to match.
  loop: "{{ lvm_lv_create_result.results }}"
  loop_control:
    label: "{{ item.item.vg }}/{{ item.item.name }}"
  # lvol only returns 'size' when it looked up an existing volume - a fresh
  # creation (real, or simulated in --check) has no on-disk size to compare against.
  when: item.size is defined and (item.size | float) > (item.item.size | regex_replace('[^0-9.]', '') | float)

- name: Check whether logical volume devices exist yet
  ansible.builtin.stat:
    path: "/dev/{{ item.vg }}/{{ item.name }}"
  loop: "{{ lvm_lvs }}"
  loop_control:
    label: "/dev/{{ item.vg }}/{{ item.name }}"
  register: lvm_lv_device_stat

- name: Create filesystems
  ansible.builtin.filesystem:
    fstype: "{{ item.item.fs }}"
    dev: "/dev/{{ item.item.vg }}/{{ item.item.name }}"
    # mkswap has no notion of growing a filesystem, so resizefs would fail
    resizefs: "{{ item.item.fs != 'swap' }}"
  loop: "{{ lvm_lv_device_stat.results }}"
  loop_control:
    label: "{{ item.item.fs }}: /dev/{{ item.item.vg }}/{{ item.item.name }}"
  # In --check, an LV that would be newly created has no device yet to format -
  # skip cleanly instead of letting the module fail on the missing device.
  when: item.stat.exists or not ansible_check_mode

# Swap has no mountpoint (fstab uses "none") and is already set up and active
# by the Debian installer, so there's nothing left to mount here.
- name: Create mount points
  ansible.builtin.file:
    path: "{{ item.mount }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ lvm_lvs }}"
  loop_control:
    label: "{{ item.mount }}"
  when: item.fs != 'swap'

- name: Mount logical volumes
  ansible.builtin.mount:
    path: "{{ item.mount }}"
    src: "/dev/{{ item.vg }}/{{ item.name }}"
    fstype: "{{ item.fs }}"
    opts: "{{ item.opts | default('defaults') }}"
    state: "{{ (item.mount == '/') | ternary('present', 'mounted') }}"
    passno: "{{ item.fsck_pass | default('0') }}"
  diff: true
  loop: "{{ lvm_lvs }}"
  loop_control:
    label: "/dev/{{ item.vg }}/{{ item.name }} -> {{ item.mount }}"
  when: item.fs != 'swap'

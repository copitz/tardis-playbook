# Runs a single stack's optional ansible.yml, if present, against the actual
# target host (no delegate_to here -- unlike template rendering, these tasks
# need real access to the host, e.g. to seed ${stacks_data_dir}/<stack>).
#
# Expects: stack (stack name), stack_ansible_src (dir containing the stack's
# source files, on the controller, e.g. the temp copy used for remote pushes).
#
# On remote hosts ansible.yml only runs when the stack's synced files changed,
# and ansible.yml itself is not synced. To re-run it when it or the vars it
# uses change, list them as restart triggers in the stack's .stack.yml
# (see files/stack.schema.json).

- name: "[{{ stack }} : Check for ansible.yml]"
  stat:
    path: "{{ stack_ansible_src }}/ansible.yml"
  register: stack_ansible_file
  delegate_to: localhost

- name: "[{{ stack }} : Run ansible.yml]"
  include_tasks: "{{ stack_ansible_src }}/ansible.yml"
  when: stack_ansible_file.stat.exists

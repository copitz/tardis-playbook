---
# Assert there actually are stacks

- name: Check whether a local stacks directory exists for this host
  stat:
    path: "{{ playbook_dir }}/stacks/{{ inventory_hostname }}"
  register: stacks_local_dir
  delegate_to: localhost

- name: Assert the local stacks directory exists
  assert:
    that: stacks_local_dir.stat.exists
    fail_msg: >-
      No local stacks directory found at {{ playbook_dir }}/stacks/{{ inventory_hostname }}.
      This role manages the stacks defined there; create the directory before running it.

# Install the `stacks` helper

- name: Install stacks script
  copy:
    src: files/stacks.sh
    dest: /usr/local/bin/stacks
    owner: root
    group: root
    mode: '0755'

- name: Install global bash completion for stacks
  copy:
    src: files/stacks.bash_completion
    dest: /etc/bash_completion.d/stacks
    owner: root
    group: root
    mode: '0644'

# Deploy stacks

- name: Handle local deployment
  include_tasks: local.yml
  when: ansible_connection == 'local'

- name: Handle remote deployment
  include_tasks: remote.yml
  when: ansible_connection != 'local'

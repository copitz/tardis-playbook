# --- Verify network connectivity (ping gateway) ---
- name: Refresh network facts
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Assert default route is via a managed iface
  vars:
    expected_iface: "{{
      network_ethernet_iface
      if network_wifi_off_when_ethernet_up and ansible_facts[network_ethernet_iface].ipv4 is defined
      else [network_ethernet_iface, network_wifi_iface] | select | list }}"
  ansible.builtin.assert:
    that: ansible_facts['default_ipv4'].interface in ([expected_iface] | flatten)
    success_msg: "Default route is via {{ ansible_facts['default_ipv4'].interface }}"
    fail_msg: "Default route is via {{ ansible_facts['default_ipv4'].interface | default('-') }}, expected {{ [expected_iface] | flatten | join(' or ') }}"

- name: Verify connectivity
  ansible.builtin.command:
    cmd: "ping -c 2 -W 2 {{ ansible_facts['default_ipv4'].gateway }}"
  register: ping_result
  changed_when: false
  check_mode: false
  retries: 3
  delay: 2
  until: ping_result.rc == 0

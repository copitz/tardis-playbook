---
- name: Assert network config is consistent
  ansible.builtin.assert:
    that:
      - network_configured_ifaces | length > 0
      - "'wifi' not in network_configured_ifaces or (network_wifi_ssid is truthy and network_wifi_psk is truthy)"
      - not network_wifi_off_when_ethernet_up or network_configured_ifaces | length == 2
      - not network_wifi_off_when_ethernet_up or network_ethernet_gateway is truthy
    fail_msg: >-
      Configure at least one of network_ethernet_iface/network_wifi_iface,
      wifi needs network_wifi_ssid and network_wifi_psk, and
      network_wifi_off_when_ethernet_up needs both ifaces and a static
      ethernet address with gateway (to probe).

- name: Assert static addresses fit their subnet
  vars:
    address: "{{ lookup('vars', 'network_' ~ item ~ '_address') }}"
    subnet: "{{ lookup('vars', 'network_' ~ item ~ '_subnet') }}"
    gateway: "{{ lookup('vars', 'network_' ~ item ~ '_gateway') }}"
  ansible.builtin.assert:
    that:
      - subnet | ansible.utils.ipaddr('net') is truthy
      - address | ansible.utils.ipaddr(subnet) is truthy
      - gateway is falsy or gateway | ansible.utils.ipaddr(subnet) is truthy
    fail_msg: "network_{{ item }}_address ({{ address }}) and _gateway ({{ gateway }}) must lie in network_{{ item }}_subnet ({{ subnet }})"
    quiet: true
  loop: "{{ network_static_ifaces }}"

- name: Install network packages
  ansible.builtin.apt:
    name: "{{ ['ifupdown']
      + (['ethtool'] if network_ethernet_iface and network_ethernet_wol else [])
      + (['wpasupplicant'] if network_wifi_iface else [])
      + (['rfkill'] if network_wifi_off_when_ethernet_up else []) }}"
    state: present

- name: Deploy /etc/network/interfaces
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    # Holds the wifi psk
    mode: "0600"
  notify: apply network config

# With DHCP on any iface, dhclient writes /etc/resolv.conf - with static ones
# only, nothing does (unless resolvconf/systemd-resolved symlinked it).
- name: Check /etc/resolv.conf
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: _resolv_conf

- name: Deploy /etc/resolv.conf
  vars:
    search: "{{ ((network_ethernet_dns_search if network_ethernet_iface else [])
      + (network_wifi_dns_search if network_wifi_iface else [])) | unique }}"
    nameservers: "{{ ((network_ethernet_dns_nameservers if network_ethernet_iface else [])
      + (network_wifi_dns_nameservers if network_wifi_iface else [])) | unique }}"
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Generated by Ansible (roles/network) for {{ inventory_hostname }} - re-run
      # the playbook to update, don't edit by hand.
      {% if search %}
      search {{ search | join(' ') }}
      {% endif %}
      {% for ns in nameservers %}
      nameserver {{ ns }}
      {% endfor %}
    mode: "0644"
  when: >-
    network_static_ifaces | length == network_configured_ifaces | length
    and not (_resolv_conf.stat.islnk | default(false))

- name: Deploy network-prefer-ethernet
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - src: network-prefer-ethernet.py.j2
      dest: /usr/local/sbin/network-prefer-ethernet
      mode: "0755"
    - src: network-prefer-ethernet.service.j2
      dest: /etc/systemd/system/network-prefer-ethernet.service
      mode: "0644"
  loop_control:
    label: "{{ item.dest }}"
  when: network_wifi_off_when_ethernet_up
  notify: apply network config

- name: Check for network-prefer-ethernet
  ansible.builtin.stat:
    path: /etc/systemd/system/network-prefer-ethernet.service
  register: _prefer_ethernet_unit
  when: not network_wifi_off_when_ethernet_up

- name: Stop network-prefer-ethernet when not needed
  ansible.builtin.systemd:
    name: network-prefer-ethernet
    enabled: false
    state: stopped
  when: not network_wifi_off_when_ethernet_up and _prefer_ethernet_unit.stat.exists

- name: Remove network-prefer-ethernet when not needed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/network-prefer-ethernet
    - /etc/systemd/system/network-prefer-ethernet.service
  when: not network_wifi_off_when_ethernet_up

- name: Apply network config
  ansible.builtin.meta: flush_handlers

- name: Enable network-prefer-ethernet
  ansible.builtin.systemd:
    name: network-prefer-ethernet
    enabled: true
    state: started
    daemon_reload: true
  when: network_wifi_off_when_ethernet_up and not ansible_check_mode

- import_tasks: verify.yml

- name: reload network
  command: ifreload -a
- name: restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
- name: restart docker
  systemd:
    name: docker
    state: restarted

- name: apply sysctl
  ansible.builtin.systemd:
    name: systemd-sysctl
    state: restarted

---
# IPv6 off by default (all + default, so also on ifaces created later) and on
# only for br-lan with network_lan_ipv6 - lo keeps it for ::1. Per-iface keys
# of not (yet) existing ifaces are applied by udev once they appear ("-"
# ignores them until then).
- name: Deploy IPv6 sysctl config
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-ipv6.conf
    content: |
      # Generated by Ansible (roles/network-trunked) for {{ inventory_hostname }} - re-run
      # the playbook to update, don't edit by hand.
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 0
      {% for iface in (['br-lan'] if network_lan_ipv6 else []) %}
      -net.ipv6.conf.{{ iface }}.disable_ipv6 = 0
      {% endfor %}
    mode: "0644"
  notify: apply sysctl
